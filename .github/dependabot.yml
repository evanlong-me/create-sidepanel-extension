version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/templates/wxt"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Keep the UI stack together in one PR so it stays latest as a unit
      ui:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@radix-ui/*"
          - "radix-ui"
          - "lucide-react"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
          - "tailwind-merge"
          - "class-variance-authority"
          - "clsx"

  - package-ecosystem: "npm"
    directory: "/templates/plasmo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      ui:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@radix-ui/*"
          - "radix-ui"
          - "lucide-react"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
          - "tailwind-merge"
          - "class-variance-authority"
          - "clsx"
